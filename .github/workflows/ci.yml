name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + testes + build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint + regras de hooks)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes de núcleo com cobertura
        run: npm run test:coverage

      - name: Build do renderer
        run: npm run build:renderer

      # Regressão importante: se o AudioWorklet voltar a ser embutido como
      # `data:` URL, a CSP (`script-src 'self'`) bloqueia o áudio no WebView.
      - name: Garante que o worklet é um asset próprio
        run: |
          test -f dist/assets/capture-processor-*.js
          ! grep -q "data:text/javascript" dist/assets/*.js

      - uses: actions/upload-artifact@v5
        with:
          name: renderer-build
          path: dist
          retention-days: 7
